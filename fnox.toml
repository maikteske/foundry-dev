# fnox.toml – AI-103 Training: Foundry-Zugang für tbit-training-ai-103-project
#
# Docs: https://fnox.jdx.dev
# Pattern-Vorbild: Development/Experiments/azure/azure-api-management/fnox.toml
#
# Commit-safe: nur Chiffretext, keine Klartext-Credentials.
# SP tbi-training-sp-ai-103-mte, Tenant Team Beverage AG (6e069cd6-…)
# Rollen: Foundry User auf Account tbit-training-ai-103-pr-resource,
#         Key Vault Secrets User auf tbi-kv-ai103-mte
#
# Entschlüsseln: az login (Key Vault Crypto Officer) lokal,
#               SP-Env (AZURE_CLIENT_ID/SECRET/TENANT) im Coder-Workspace
#
# Setzen:  fnox set AZURE_CLIENT_ID <wert>   # usw.
# Lesen:   fnox get AZURE_CLIENT_ID
# Lease:   fnox exec -- sh -c 'curl -H "Authorization: Bearer $FOUNDRY_TOKEN" …'

default_provider = "azure-kms"

# ─── Provider ─────────────────────────────────────────────────────────────────────────────
[providers.azure-kms]
type = "azure-kms"
vault_url = "https://tbi-kv-ai103-mte.vault.azure.net/"
key_name = "fnox-crypto"

# ─── Leases (kurzlebige Tokens) ──────────────────────────────────────────────────────────
# Foundry-Dataplane-Token (Projekt-API). Azure kontrolliert die Lifetime (~1h).
[leases.azure-foundry]
type = "azure-token"
scope = "https://ai.azure.com/.default"
env_var = "FOUNDRY_TOKEN"

[secrets]
AZURE_CLIENT_SECRET= { provider = "azure-kms", value = "", description = "Client Secret des SP tbi-training-sp-ai-103-mte (KV-verschluesselt, Rotation: az ad app credential reset)" }

# Management-API (ARM) für az-Rest/CLI-freie Admin-Zugriffe:
[leases.azure-arm]
type = "azure-token"
scope = "https://management.azure.com/.default"
env_var = "AZURE_ARM_TOKEN"

# ─── Secrets ─────────────────────────────────────────────────────────────────────────────
# Nur noch AZURE_CLIENT_SECRET via `fnox set` befüllen.
# AZURE_CLIENT_ID / AZURE_TENANT_ID sind keine Secrets und liegen in mise.toml [env].
